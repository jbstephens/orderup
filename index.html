<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-user-select:none; user-select:none;
      -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1c1210;
      font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
      touch-action:none; }
  body { display:flex; align-items:center; justify-content:center; }
  #game { display:block; touch-action:none; }

<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   ORDER UP! — the Stephens Diner
   Ticket-rush cooking for the Stephens Arcade. Golden-hour diner, tickets
   slide onto the rail, you build the dish layer by layer, exact match
   auto-serves with a DING. Never a fail state. 60fps on the Pi.
   ═══════════════════════════════════════════════════════════════════════ */

// ── Low-fx flag (console mode). The bundler injects the persistence shim;
//    here we only READ the flag and trim cosmetic extras.
const LOWFX = (function(){
  try {
    if (/[?&]fx=low\b/.test(location.search)) return true;
    if (/[?&]fx=full\b/.test(location.search)) return false;
    return localStorage.getItem('arcade_lowfx') === '1';
  } catch (e) { return false; }
})();

// ── Palette: warm diner at golden hour. One palette, everything obeys it.
const PAL = {
  ink:'#3b2620', inkSoft:'#5d4437',
  cream:'#f9ecd2', creamDk:'#ecd9b4', paper:'#fdf6e4',
  red:'#e04f3f', redDk:'#b03528', redDeep:'#8c2a20',
  teal:'#3fbfae', tealDk:'#2d8f84', tealDeep:'#1f6b62',
  gold:'#ffb63e', goldLt:'#ffd98c', goldDk:'#d98f1f',
  skyTop:'#ffe9ae', skyMid:'#ffbf6d', skyLow:'#ff8d5e', sun:'#fff6d0',
  hills:'#d98a4e',
  chromeLt:'#eef3f6', chrome:'#b9c6cf', chromeDk:'#77858f', chromeDeep:'#4d5a63',
  wall:'#f3dcae', wallDk:'#e6c68f',
};
const NEONS = {
  pink:   { core:'#ffd7e8', mid:'#ff5f9e', glow:'#ff2f7e' },
  teal:   { core:'#d8fff8', mid:'#3de0d2', glow:'#00c3ae' },
  gold:   { core:'#fff3cf', mid:'#ffc63e', glow:'#ff9d00' },
  violet: { core:'#eadcff', mid:'#a56bff', glow:'#7d2fff' },
};
const COUNTERS = {
  classic: { top:'#d94f3c', top2:'#f0705a', front:'#b03528', name:'CHERRY RED' },
  mint:    { top:'#4cc7b6', top2:'#7adfd1', front:'#2d8f84', name:'MINT' },
  wood:    { top:'#c9803f', top2:'#e0a05f', front:'#8c5a28', name:'OAK WOOD' },
};

const FONT  = "Verdana, 'DejaVu Sans', 'Helvetica Neue', sans-serif";
const FONTB = "'Arial Black', 'Arial Bold', Verdana, 'DejaVu Sans', sans-serif";
function fnt(px, black){ return '900 ' + px + 'px ' + (black ? FONTB : FONT); }
function fntN(px){ return '700 ' + px + 'px ' + FONT; }

// Diamond-position glyphs (never platform labels)
const GL = { south:'✕', east:'○', west:'□', north:'△' };

// ── Storage (kid machines, private mode, sandboxes: always guarded)
const LS = {
  get(k, d){ try { const v = localStorage.getItem('orderup_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('orderup_' + k, JSON.stringify(v)); } catch (e) {} },
};

// ── Canvas + scale-to-fit letterbox
const W = 1280, H = 720;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
function resize(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width  = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', resize); resize();
function toLogical(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}

// ── Tiny utils
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn  = t => t * t;
function rnd(a, b){ return a + Math.random() * (b - a); }
function pick(arr){ return arr[(Math.random() * arr.length) | 0]; }
function mk(w, h){ const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
function rr(g, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function vgrad(g, y0, y1, stops){
  const gr = g.createLinearGradient(0, y0, 0, y1);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  return gr;
}

// Sprite draw helper — the per-frame hot path is drawImage + transforms only.
function di(sp, x, y, s, rot, a){
  s = s || 1;
  const w = sp.cv.width * s, h = sp.cv.height * s;
  if (!rot){
    if (a !== undefined && a < 1){ ctx.globalAlpha = a; ctx.drawImage(sp.cv, x - sp.ax * s, y - sp.ay * s, w, h); ctx.globalAlpha = 1; }
    else ctx.drawImage(sp.cv, x - sp.ax * s, y - sp.ay * s, w, h);
  } else {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    if (a !== undefined && a < 1) ctx.globalAlpha = a;
    ctx.drawImage(sp.cv, -sp.ax * s, -sp.ay * s, w, h);
    ctx.restore();
  }
}
// Squash-and-stretch variant: vertical scale sy around the anchor baseline.
function diSquash(sp, x, y, s, sy){
  ctx.drawImage(sp.cv, x - sp.ax * s, y - sp.ay * s * sy, sp.cv.width * s, sp.cv.height * s * sy);
}
function txt(str, x, y, px, color, align, black, shadow){
  ctx.font = fnt(px, black);
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (shadow){ ctx.fillStyle = shadow; ctx.fillText(str, x, y + Math.max(2, px * 0.07)); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function txtN(str, x, y, px, color, align){
  ctx.font = fntN(px);
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

/* ═══════════════ AUDIO — WebAudio synth, context created lazily ═══════ */
const SFX = (function(){
  let ac = null, master = null, noiseBuf = null;
  function ctx0(){
    if (!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      const len = ac.sampleRate * 0.5;
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(o){
    const a = ctx0(); if (!a) return;
    const t = a.currentTime + (o.at || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + (o.atk || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + o.dur + 0.02);
  }
  function noise(o){
    const a = ctx0(); if (!a) return;
    const t = a.currentTime + (o.at || 0);
    const src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = a.createBiquadFilter();
    f.type = o.ftype || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    f.Q.value = o.q || 1;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.15, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + o.dur + 0.02);
  }
  return {
    unlock(){ try { ctx0(); } catch (e) {} },
    ctx(){ return ac; },
    master(){ return master; },
    // each layer lands with a musical plop that rises in pitch
    plop(i){
      const f = 240 * Math.pow(2, Math.min(i, 9) / 7);
      tone({ f0: f * 0.7, f1: f, dur: 0.12, type: 'triangle', vol: 0.3 });
      tone({ f0: f * 2, f1: f * 1.4, dur: 0.05, type: 'sine', vol: 0.1 });
    },
    ding(){
      tone({ f0: 1568, dur: 0.7, type: 'sine', vol: 0.22 });
      tone({ f0: 2637, dur: 0.5, type: 'sine', vol: 0.12 });
      tone({ f0: 3140, dur: 0.25, type: 'sine', vol: 0.06 });
      noise({ f: 6000, q: 2, dur: 0.03, vol: 0.1 });
    },
    bounce(){
      tone({ f0: 320, f1: 110, dur: 0.18, type: 'square', vol: 0.12 });
      tone({ f0: 160, f1: 70, dur: 0.14, type: 'triangle', vol: 0.14, at: 0.02 });
    },
    scrap(){
      noise({ f: 900, q: 1.2, dur: 0.16, vol: 0.2 });
      tone({ f0: 820, f1: 500, dur: 0.13, type: 'square', vol: 0.07, at: 0.01 });
      tone({ f0: 205, dur: 0.2, type: 'triangle', vol: 0.12, at: 0.05 });
    },
    tip(n){
      const base = [988, 1319, 1568];
      for (let i = 0; i < Math.min(3, 1 + (n > 8 ? 1 : 0) + (n > 15 ? 1 : 0)); i++)
        tone({ f0: base[i], dur: 0.09, type: 'square', vol: 0.09, at: i * 0.07 });
    },
    move(){ tone({ f0: 660, dur: 0.045, type: 'square', vol: 0.05 }); },
    back(){ tone({ f0: 380, f1: 300, dur: 0.08, type: 'square', vol: 0.06 }); },
    hurry(){
      tone({ f0: 740, dur: 0.09, type: 'sine', vol: 0.1 });
      tone({ f0: 880, dur: 0.11, type: 'sine', vol: 0.1, at: 0.11 });
    },
    walk(){
      tone({ f0: 392, f1: 340, dur: 0.25, type: 'sine', vol: 0.12 });
      tone({ f0: 294, f1: 262, dur: 0.3, type: 'sine', vol: 0.1, at: 0.22 });
    },
    stamp(){ noise({ f: 300, q: 0.8, dur: 0.09, vol: 0.28, ftype: 'lowpass' }); },
    star(i){
      tone({ f0: 1047 * Math.pow(2, i / 4), dur: 0.35, type: 'sine', vol: 0.2 });
      tone({ f0: 2093 * Math.pow(2, i / 4), dur: 0.2, type: 'sine', vol: 0.07 });
    },
    jingle(){
      const seq = [523, 659, 784, 1047];
      seq.forEach((f, i) => tone({ f0: f, dur: 0.18, type: 'triangle', vol: 0.16, at: i * 0.09 }));
      tone({ f0: 1319, dur: 0.5, type: 'triangle', vol: 0.16, at: 0.38 });
    },
    flip(){ noise({ f: 900, f1: 3600, dur: 0.16, vol: 0.09 }); tone({ f0: 900, f1: 1800, dur: 0.14, type: 'sine', vol: 0.05 }); },
    join(){ [392, 523, 659, 784].forEach((f, i) => tone({ f0: f, dur: 0.1, type: 'square', vol: 0.08, at: i * 0.06 })); },
    buy(){
      noise({ f: 5000, q: 3, dur: 0.05, vol: 0.12 });
      tone({ f0: 988, dur: 0.08, type: 'square', vol: 0.09, at: 0.02 });
      tone({ f0: 1319, dur: 0.14, type: 'square', vol: 0.09, at: 0.1 });
      tone({ f0: 1760, dur: 0.3, type: 'sine', vol: 0.12, at: 0.18 });
    },
    nope(){ tone({ f0: 220, dur: 0.09, type: 'square', vol: 0.07 }); tone({ f0: 196, dur: 0.12, type: 'square', vol: 0.07, at: 0.1 }); },
    count(go){ tone({ f0: go ? 1047 : 523, dur: go ? 0.4 : 0.12, type: 'square', vol: 0.12 }); },
    sizzle(){ noise({ f: 4200, q: 0.7, dur: 0.35, vol: 0.05 }); },
    pause(on){ tone({ f0: on ? 523 : 659, f1: on ? 392 : 784, dur: 0.12, type: 'square', vol: 0.08 }); },
  };
})();

// ── Jukebox (cosmetic purchase): a lazy swing loop, only during service.
const JUKE = (function(){
  let next = 0, step = 0;
  const bass = [131, 131, 165, 165, 175, 175, 165, 147];   // C E F E walk
  const plink = [523, 0, 659, 0, 587, 0, 784, 0];
  function schedule(a, master){
    const spb = 60 / 96 / 2;   // 96bpm eighths
    while (next < a.currentTime + 0.35){
      const sw = (step % 2) ? spb * 0.12 : 0;
      const t = next + sw;
      const f = bass[step % 8];
      const osc = a.createOscillator(), g = a.createGain();
      osc.type = 'triangle'; osc.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.055, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + spb * 0.9);
      osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + spb);
      const pf = plink[(step + 4) % 8];
      if (pf && (step % 4 === 2)){
        const o2 = a.createOscillator(), g2 = a.createGain();
        o2.type = 'square'; o2.frequency.value = pf;
        g2.gain.setValueAtTime(0.0001, t);
        g2.gain.exponentialRampToValueAtTime(0.02, t + 0.01);
        g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
        o2.connect(g2); g2.connect(master); o2.start(t); o2.stop(t + 0.2);
      }
      next += spb; step++;
    }
  }
  return {
    update(active){
      const a = SFX.ctx();
      if (!a || !active) { next = 0; return; }
      if (next === 0) { next = a.currentTime + 0.1; step = 0; }
      schedule(a, SFX.master());
    },
  };
})();
/* ═══════════════ INGREDIENTS — the food is the hero ═══════════════════
   Each ingredient draws in "layer space": (0,0) = baseline center, food
   rises into negative y. Baked once at load into hero / mini / icon
   sprites; gameplay only ever drawImages them. */

const ING = {};
const ING_ORDER = [];
function defIng(o){ ING[o.id] = o; ING_ORDER.push(o.id); }

// — burger family —
defIng({ id:'bun', name:'BUN', w:214, variants:true,
  up:{ bottom:32, top:56 }, dn:{ bottom:4, top:4 }, rise:{ bottom:24, top:46 },
  draw(g, v){
    if (v === 'bottom'){
      rr(g, -100, -28, 200, 28, 12);
      g.fillStyle = vgrad(g, -28, 0, [[0, '#fdeecb'], [0.45, '#f2c277'], [1, '#dd9440']]); g.fill();
      rr(g, -94, -27, 188, 7, 4); g.fillStyle = 'rgba(255,248,224,0.85)'; g.fill();
    } else {
      g.beginPath(); g.ellipse(0, -6, 104, 48, 0, Math.PI, 0); g.closePath();
      g.fillStyle = vgrad(g, -54, -4, [[0, '#ffd28d'], [0.55, '#efa851'], [1, '#d98a33']]); g.fill();
      // baked gloss
      g.beginPath(); g.ellipse(-30, -36, 46, 14, -0.28, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,240,205,0.5)'; g.fill();
      // sesame seeds
      g.fillStyle = '#fdf2d0';
      const seeds = [[-62,-18,.5],[-38,-34,-.4],[-6,-42,.15],[28,-36,.5],[56,-20,-.3],[10,-24,-.6],[-28,-12,.2],[44,-8,.4],[-70,-6,-.2],[70,-10,.1]];
      for (const [sx, sy, sr] of seeds){
        g.save(); g.translate(sx, sy); g.rotate(sr);
        g.beginPath(); g.ellipse(0, 0, 4.6, 2.6, 0, 0, Math.PI * 2); g.fill(); g.restore();
      }
    }
  }});
defIng({ id:'patty', name:'PATTY', w:204, up:30, dn:4, rise:20,
  draw(g){
    rr(g, -98, -26, 196, 28, 13);
    g.fillStyle = vgrad(g, -26, 2, [[0, '#9a5730'], [0.5, '#7a3f1e'], [1, '#552a12']]); g.fill();
    g.fillStyle = 'rgba(40,18,6,0.5)';
    for (const cx of [-62, -14, 38, 74]){ rr(g, cx - 14, -12, 28, 5, 2.5); g.fill(); }
    rr(g, -88, -24, 176, 6, 3); g.fillStyle = 'rgba(255,190,120,0.35)'; g.fill();
  }});
defIng({ id:'cheese', name:'CHEESE', w:196, up:18, dn:14, rise:8,
  draw(g){
    g.beginPath();
    g.moveTo(-92, -14); g.lineTo(92, -14);
    g.quadraticCurveTo(96, -6, 88, 10);   // droopy right corner
    g.quadraticCurveTo(60, 2, 34, 4);
    g.quadraticCurveTo(8, 6, -20, 3);
    g.quadraticCurveTo(-52, 0, -84, 12);  // droopy left corner
    g.quadraticCurveTo(-96, -4, -92, -14);
    g.closePath();
    g.fillStyle = vgrad(g, -14, 12, [[0, '#ffd23e'], [0.6, '#ffb02e'], [1, '#f09011']]); g.fill();
    rr(g, -80, -13, 160, 4, 2); g.fillStyle = 'rgba(255,240,170,0.7)'; g.fill();
  }});
defIng({ id:'lettuce', name:'LETTUCE', w:206, up:16, dn:12, rise:8,
  draw(g){
    g.beginPath(); g.moveTo(-100, -8);
    for (let i = 0; i < 7; i++){
      const x0 = -100 + i * 200 / 7, x1 = -100 + (i + 1) * 200 / 7;
      g.quadraticCurveTo((x0 + x1) / 2, 12, x1, -8);
    }
    g.lineTo(100, -16); g.lineTo(-100, -16); g.closePath();
    g.fillStyle = vgrad(g, -16, 12, [[0, '#8fd455'], [0.6, '#5fae35'], [1, '#448527']]); g.fill();
    g.fillStyle = 'rgba(220,255,170,0.5)';
    rr(g, -92, -15, 184, 4, 2); g.fill();
  }});
defIng({ id:'tomato', name:'TOMATO', w:176, up:18, dn:4, rise:10,
  draw(g){
    rr(g, -86, -16, 172, 18, 9);
    g.fillStyle = vgrad(g, -16, 2, [[0, '#f26a52'], [0.5, '#e0402e'], [1, '#b52d1e']]); g.fill();
    g.beginPath(); g.ellipse(0, -7, 70, 6, 0, 0, Math.PI * 2);
    g.fillStyle = 'rgba(255,150,125,0.55)'; g.fill();
    g.fillStyle = 'rgba(255,225,200,0.5)';
    for (const sx of [-46, -15, 16, 47]){ g.beginPath(); g.ellipse(sx, -7, 4, 2.4, 0, 0, Math.PI * 2); g.fill(); }
  }});

// — fries basket —
defIng({ id:'basket', name:'BASKET', w:204, up:52, dn:4, rise:24,
  draw(g){
    g.beginPath(); g.moveTo(-96, 0); g.lineTo(-80, -46); g.lineTo(80, -46); g.lineTo(96, 0); g.closePath();
    g.fillStyle = vgrad(g, -46, 0, [[0, '#e8604a'], [0.6, '#cf4231'], [1, '#a32e21']]); g.fill();
    g.save(); g.clip();
    g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = 5;
    for (let i = -5; i <= 5; i++){
      g.beginPath(); g.moveTo(i * 26 - 40, 4); g.lineTo(i * 26 + 12, -50); g.stroke();
      g.beginPath(); g.moveTo(i * 26 + 12, 4); g.lineTo(i * 26 - 40, -50); g.stroke();
    }
    g.restore();
    // paper liner peeking over the rim
    g.beginPath(); g.moveTo(-78, -44);
    for (let i = 0; i < 6; i++){
      const x0 = -78 + i * 156 / 6, x1 = -78 + (i + 1) * 156 / 6;
      g.quadraticCurveTo((x0 + x1) / 2, -58, x1, -44);
    }
    g.lineTo(78, -36); g.lineTo(-78, -36); g.closePath();
    g.fillStyle = '#fdf6e4'; g.fill();
  }});
defIng({ id:'fries', name:'FRIES', w:176, up:56, dn:0, rise:26,
  draw(g){
    const sticks = [[-62,-2,-0.24],[-40,-8,-0.14],[-18,-11,-0.06],[4,-12,0.03],[26,-10,0.12],[48,-5,0.2],[-30,-2,-0.08],[14,-3,0.06],[-6,-5,0]];
    for (let i = 0; i < sticks.length; i++){
      const [x, y, r] = sticks[i];
      g.save(); g.translate(x, y); g.rotate(r);
      rr(g, -8, -52, 16, 52, 5);
      g.fillStyle = i % 2 ? '#ffd76e' : '#f5b942'; g.fill();
      rr(g, -8, -52, 6, 52, 3); g.fillStyle = 'rgba(255,244,200,0.55)'; g.fill();
      g.restore();
    }
  }});

// — hot dog —
defIng({ id:'roll', name:'ROLL', w:234, up:36, dn:6, rise:14,

/* ── Sprite bakery for ingredients ── */
const MINI_S = 0.24;
function bakeSprite(ing, variant, scale){
  const up = ing.variants ? ing.up[variant] : ing.up;
  const dn = ing.variants ? ing.dn[variant] : ing.dn;
  const w = ing.w * scale + 6, h = (up + dn) * scale + 6;
  const c = mk(w, h), g = c.getContext('2d');
  g.translate(w / 2, up * scale + 3);
  g.scale(scale, scale);
  ing.draw(g, variant);
  return { cv: c, ax: w / 2, ay: up * scale + 3 };
}
function bakeIngredients(){
  for (const id of ING_ORDER){
    const ing = ING[id];
    ing.spr = {};
    const variants = ing.variants ? ['bottom', 'top'] : ['def'];
    for (const v of variants){
      ing.spr[v] = { hero: bakeSprite(ing, v, 1), mini: bakeSprite(ing, v, MINI_S) };
    }
    // icon: fit in a 52px box, prefer the recognizable variant
    const iv = ing.variants ? 'top' : 'def';
    const up = ing.variants ? ing.up[iv] : ing.up, dn = ing.variants ? ing.dn[iv] : ing.dn;
    const s = Math.min(52 / ing.w, 46 / (up + dn));
    ing.icon = bakeSprite(ing, iv, s);
  }
}
// Position-aware access: buns render as bottom slab at index 0, dome above.
function layerSpr(ingId, idx, size){
  const ing = ING[ingId];
  if (ing.variants){
    const v = idx === 0 ? 'bottom' : 'top';
    return { spr: ing.spr[v][size], rise: ing.rise[v] };
  }
  return { spr: ing.spr.def[size], rise: ing.rise };
}
function stackHeight(seq){
  let h = 0;
  for (let i = 0; i < seq.length; i++) h += layerSpr(seq[i], i, 'hero').rise;
  return h;
}
/* ═══════════════ WORLD BAKERY — everything pre-rendered at load ═══════ */
const B = { neon:{}, logo:{} };

function anchorSpr(c, ax, ay){ return { cv:c, ax, ay }; }

// Neon lettering with a BAKED glow (no shadowBlur anywhere): ring-offset
// glow passes, then tube stroke, then hot core.
function bakeNeonText(text, px, nk, pad){
  const col = NEONS[nk];
  const m = mk(10, 10).getContext('2d');
  m.font = 'italic 900 ' + px + 'px ' + FONTB;
  const tw = m.measureText(text).width;
  pad = pad || px * 0.6;
  const c = mk(tw + pad * 2, px * 1.5 + pad * 2), g = c.getContext('2d');
  const cx = c.width / 2, cy = c.height / 2;
  g.font = 'italic 900 ' + px + 'px ' + FONTB;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const [r, a] of [[px * 0.22, 0.045], [px * 0.13, 0.07], [px * 0.07, 0.1], [px * 0.035, 0.16]]){
    g.fillStyle = col.glow; g.globalAlpha = a;
    for (let k = 0; k < 10; k++){
      const th = k / 10 * Math.PI * 2;
      g.fillText(text, cx + Math.cos(th) * r, cy + Math.sin(th) * r);
    }
  }
  g.globalAlpha = 1;
  g.lineJoin = 'round';
  g.strokeStyle = col.mid; g.lineWidth = Math.max(4, px * 0.1);
  g.strokeText(text, cx, cy);
  g.fillStyle = col.core; g.fillText(text, cx, cy);
  return anchorSpr(c, cx, cy);
}
function bakeNeonSign(nk){
  const t = bakeNeonText('ORDER UP!', 30, nk, 16);
  const w = t.cv.width + 26, h = t.cv.height + 18;
  const c = mk(w, h), g = c.getContext('2d');
  rr(g, 2, 2, w - 4, h - 4, 14);
  g.fillStyle = 'rgba(38,22,26,0.92)'; g.fill();
  g.strokeStyle = PAL.chrome; g.lineWidth = 4; g.stroke();
  rr(g, 8, 8, w - 16, h - 16, 10);
  g.strokeStyle = NEONS[nk].mid; g.globalAlpha = 0.5; g.lineWidth = 2.5; g.stroke();
  g.globalAlpha = 1;
  g.drawImage(t.cv, (w - t.cv.width) / 2, (h - t.cv.height) / 2);
  return anchorSpr(c, w / 2, h / 2);
}
function neonSign(nk){ if (!B.neon[nk]) B.neon[nk] = bakeNeonSign(nk); return B.neon[nk]; }
function neonLogo(nk){ if (!B.logo[nk]) B.logo[nk] = bakeNeonText('ORDER UP!', 92, nk, 60); return B.logo[nk]; }

// ── Diner background (shared painter for 1P / 2P halves / title)
function paintWindow(g, x, y, w, h, sunPos){
  // sky at golden hour
  g.save();
  rr(g, x, y, w, h, 14); g.clip();
  g.fillStyle = vgrad(g, y, y + h, [[0, PAL.skyTop], [0.55, PAL.skyMid], [1, PAL.skyLow]]);
  g.fillRect(x, y, w, h);
  if (sunPos){
    const sx = x + w * sunPos, sy = y + h * 0.62;
    const rad = g.createRadialGradient(sx, sy, 4, sx, sy, w * 0.5);
    rad.addColorStop(0, 'rgba(255,246,208,0.95)');
    rad.addColorStop(0.18, 'rgba(255,236,170,0.55)');
    rad.addColorStop(1, 'rgba(255,220,140,0)');
    g.fillStyle = rad; g.fillRect(x, y, w, h);
    g.beginPath(); g.arc(sx, sy, w * 0.085, 0, Math.PI * 2); g.fillStyle = PAL.sun; g.fill();
  }
  // rolling hills silhouette
  g.fillStyle = PAL.hills; g.globalAlpha = 0.8;
  g.beginPath(); g.moveTo(x, y + h);
  g.quadraticCurveTo(x + w * 0.22, y + h * 0.68, x + w * 0.45, y + h * 0.85);
  g.quadraticCurveTo(x + w * 0.7, y + h * 0.98, x + w, y + h * 0.8);
  g.lineTo(x + w, y + h); g.closePath(); g.fill();
  g.globalAlpha = 1;
  // birds
  g.strokeStyle = 'rgba(90,50,30,0.55)'; g.lineWidth = 2; g.lineCap = 'round';
  for (const [bx, by, bs] of [[0.3, 0.3, 7], [0.42, 0.24, 5], [0.55, 0.34, 6]]){
    const vx = x + w * bx, vy = y + h * by;
    g.beginPath(); g.moveTo(vx - bs, vy); g.quadraticCurveTo(vx - bs / 2, vy - bs * 0.7, vx, vy);
    g.quadraticCurveTo(vx + bs / 2, vy - bs * 0.7, vx + bs, vy); g.stroke();
  }
  g.restore();
  // chrome frame + mullions
  g.strokeStyle = PAL.chromeDk; g.lineWidth = 12; rr(g, x, y, w, h, 14); g.stroke();
  g.strokeStyle = PAL.chrome; g.lineWidth = 7; rr(g, x, y, w, h, 14); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.65)'; g.lineWidth = 2;
  rr(g, x - 2, y - 2, w + 4, h + 4, 15); g.stroke();
  g.strokeStyle = PAL.chrome; g.lineWidth = 5;
  g.beginPath(); g.moveTo(x + w / 2, y + 4); g.lineTo(x + w / 2, y + h - 4); g.stroke();
}
function paintAwning(g, x, y, w){
  const n = Math.max(4, Math.round(w / 56)), sw = w / n, h = 34;
  for (let i = 0; i < n; i++){
    g.fillStyle = i % 2 ? PAL.cream : PAL.red;
    g.fillRect(x + i * sw, y, sw + 0.5, h - 12);
    g.beginPath(); g.arc(x + i * sw + sw / 2, y + h - 12, sw / 2, 0, Math.PI);
    g.fill();
  }
  g.fillStyle = 'rgba(60,20,10,0.18)'; g.fillRect(x, y + h + 2, w, 5);
}
function paintDinerHalf(g, off, w, cosm, opts){
  const cKey = COUNTERS[cosm.counter] || COUNTERS.classic;
  // wall
  g.fillStyle = vgrad(g, 0, 460, [[0, '#eccf98'], [0.4, PAL.wall], [1, '#f7e6bf']]);
  g.fillRect(off, 0, w, 460);
  // windows
  const wins = opts.windows;
  for (let i = 0; i < wins.length; i++){
    const [wx, ww] = wins[i];
    paintWindow(g, off + wx, 44, ww, 264, i === opts.sunWin ? 0.62 : 0);
    // light spill on the wall below the window
    g.fillStyle = vgrad(g, 308, 400, [[0, 'rgba(255,205,120,0.3)'], [1, 'rgba(255,205,120,0)']]);
    g.beginPath();
    g.moveTo(off + wx + 6, 312); g.lineTo(off + wx + ww - 6, 312);
    g.lineTo(off + wx + ww + 26, 400); g.lineTo(off + wx - 26, 400);
    g.closePath(); g.fill();

  g.beginPath(); g.rect(off, 450, w, 64); g.clip();

  g.fillStyle = vgrad(g, 514, 540, [[0, PAL.chromeLt], [0.5, PAL.chrome], [1, PAL.chromeDk]]);
  g.fillRect(off, 514, w, 26);

  // checkerboard floor
  const fy = 686;
  g.fillStyle = '#2f2622'; g.fillRect(off, fy - 6, w, 720 - fy + 6);

}

// ── customer faces: 4 moods × 3 skins, hand-expressive
const SKINS = ['#ffd9ad', '#e0a06b', '#9c6a44'];
const HAIRS = ['#5d4437', '#2f2622', '#b03528'];
function bakeFaces(){
  B.faces = [];
  for (let sk = 0; sk < 3; sk++){
    const set = [];
    for (let mood = 0; mood < 4; mood++){
      const c = mk(52, 52), g = c.getContext('2d');
      g.translate(26, 27);
      g.beginPath(); g.arc(0, 0, 22, 0, Math.PI * 2);
      g.fillStyle = SKINS[sk]; g.fill();
      g.strokeStyle = 'rgba(60,30,15,0.5)'; g.lineWidth = 2.5; g.stroke();
      // hair tuft
      g.fillStyle = HAIRS[sk];
      g.beginPath(); g.arc(0, -2, 22, Math.PI + 0.45, -0.45);
      g.quadraticCurveTo(10, -16, 0, -13);
      g.quadraticCurveTo(-12, -16, -19, -8);
      g.closePath(); g.fill();
      g.lineCap = 'round';
      const eye = (ex) => { g.fillStyle = '#3b2620'; g.beginPath(); g.arc(ex, -2, 2.8, 0, Math.PI * 2); g.fill(); };
      g.strokeStyle = '#3b2620'; g.lineWidth = 2.8;
      if (mood === 0){        // happy
        eye(-8); eye(8);
        g.beginPath(); g.arc(0, 4, 8.5, 0.25, Math.PI - 0.25); g.stroke();
        g.fillStyle = 'rgba(240,110,90,0.5)';
        g.beginPath(); g.arc(-13, 6, 3.5, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(13, 6, 3.5, 0, Math.PI * 2); g.fill();
      } else if (mood === 1){ // okay
        eye(-8); eye(8);
        g.beginPath(); g.moveTo(-6, 9); g.lineTo(6, 9); g.stroke();
      } else if (mood === 2){ // worried
        eye(-8); eye(8);
        g.beginPath(); g.moveTo(-12, -9); g.lineTo(-5, -7); g.moveTo(12, -9); g.lineTo(5, -7); g.stroke();
        g.beginPath(); g.arc(0, 10, 4, 0, Math.PI * 2); g.stroke();
        g.fillStyle = '#7fd0f0';
        g.beginPath(); g.arc(17, -10, 3.6, 0, Math.PI * 2); g.fill();
      } else {                // sad (leaving — still gentle)
        g.beginPath(); g.moveTo(-11, -3); g.lineTo(-5, -1); g.moveTo(11, -3); g.lineTo(5, -1); g.stroke();
        g.beginPath(); g.arc(0, 14, 8, Math.PI + 0.35, -0.35); g.stroke();
        eye(-8); eye(8);
      }
      set.push(anchorSpr(c, 26, 27));
    }
    B.faces.push(set);
  }
}

function makeLayout(off, w, two){
  return {
    off, w, two,
    railY: 8,
    ticketW: two ? 126 : 150, ticketH: two ? 152 : 182,
    slots: two ? 3 : 4,
    slotX(i){ return off + (two ? 20 : 26) + i * (two ? 142 : 164); },
    plateX: off + (two ? 302 : 520), plateY: 468,
    passX: off + (two ? 566 : 1146), passY: 452,
    cookX: off + (two ? 118 : 250),
    hero: two ? 0.72 : 1,
    grid: { tile: two ? 56 : 62, gap: two ? 6 : 8, perRow: 7, cx: off + (two ? 320 : 640), topY: two ? 526 : 512 },
  };
}
const LAY1 = [makeLayout(0, 1280, false)];
const LAY2 = [makeLayout(0, 640, true), makeLayout(640, 640, true)];

function gridRects(L, n){
  const t = L.grid.tile, gp = L.grid.gap, per = L.grid.perRow;
  const rows = Math.ceil(n / per), out = [];
  for (let i = 0; i < n; i++){
    const r = (i / per) | 0;
    const inRow = (r === rows - 1) ? n - r * per : per;
    const rowW = inRow * t + (inRow - 1) * gp;
    out.push({
      x: L.grid.cx - rowW / 2 + (i - r * per) * (t + gp) + t / 2,
      y: L.grid.topY + r * (t + gp) + t / 2, s: t,
    });
  }
  return out;
}
// Bake the whole ingredient counter into ONE panel canvas per layout type.
function bakeGridPanel(ids, L){
  const rects = gridRects(L, ids.length);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const r of rects){
    x0 = Math.min(x0, r.x - r.s / 2); x1 = Math.max(x1, r.x + r.s / 2);
    y0 = Math.min(y0, r.y - r.s / 2); y1 = Math.max(y1, r.y + r.s / 2);
  }
  const pad = 14;
  const c = mk(x1 - x0 + pad * 2, y1 - y0 + pad * 2), g = c.getContext('2d');
  // steel tray
  rr(g, 2, 2, c.width - 4, c.height - 4, 16);
  g.fillStyle = vgrad(g, 0, c.height, [[0, '#c8d3da'], [0.12, '#9fadb7'], [1, '#5f6d77']]); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 2.5; g.stroke();
  for (let i = 0; i < ids.length; i++){
    const r = rects[i], x = r.x - x0 + pad, y = r.y - y0 + pad, s = r.s / 64;
    g.drawImage(B.tile.cv, x - 32 * s, y - 32 * s, 64 * s, 64 * s);
    const ic = ING[ids[i]].icon;
    const is = Math.min((r.s - 8) / ic.cv.width, (r.s - 12) / ic.cv.height);
    g.drawImage(ic.cv, x - ic.cv.width * is / 2, y - ic.cv.height * is / 2 + 1.5, ic.cv.width * is, ic.cv.height * is);
  }
  return { spr: anchorSpr(c, 0, 0), x: x0 - pad, y: y0 - pad, rects };
}

let partCount = 0;
function spawnPart(spr, x, y, o){
  const cap = LOWFX ? 44 : 120;
  if (partCount >= cap) return;
  for (const p of PARTS){
    if (p.on) continue;
    p.on = true; partCount++;
    p.spr = spr; p.x = x; p.y = y;
    p.vx = o.vx || 0; p.vy = o.vy || 0;
    p.t = 0; p.life = o.life || 0.8;

    p.rot = o.rot || 0; p.vr = o.vr || 0;
    p.grav = o.grav || 0; p.a = o.a !== undefined ? o.a : 1;

function updateParts(dt){
  for (const p of PARTS){
    if (!p.on) continue;
    p.t += dt;
    if (p.t >= p.life){ p.on = false; partCount--; continue; }
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;

function bakeTicketCard(t){

  const c = TICKET_CV_POOL.pop() || mk(cw, ch);
  const g = c.getContext('2d');
  g.clearRect(0, 0, cw, ch);

  g.fillStyle = PAL.chromeDk; g.fillRect(cw / 2 - 3, 0, 6, 12);
  g.fillStyle = PAL.chrome; rr(g, cw / 2 - 16, 8, 32, 10, 4); g.fill();

  g.fillStyle = vgrad(g, 14, ch, [[0, '#fffbf0'], [0.85, PAL.paper], [1, '#efe2c4']]); g.fill();
  g.strokeStyle = 'rgba(120,90,50,0.35)'; g.lineWidth = 2; g.stroke();

    totH += ls.rise; maxW = Math.max(maxW, ls.spr.cv.width);

  const ps = Math.min(0.34, 88 / totH, 126 / maxW);
  let base = ch - 50;
  for (let i = 0; i < t.seq.length; i++){
    const ls = layerSpr(t.seq[i], i, 'hero');
    g.drawImage(ls.spr.cv, cw / 2 - ls.spr.ax * ps, base - ls.spr.ay * ps, ls.spr.cv.width * ps, ls.spr.cv.height * ps);

/* ── grid nav ── */
function gridDims(n){
  const per = 7, rows = Math.ceil(n / per);
  return { per, rows, inRow(r){ return r === rows - 1 ? n - r * per : per; } };
}
function moveSel(p, dx, dy){
  const n = p.unlocked.length;
  if (!n) return;
  const d = gridDims(n);
  let r = (p.sel / d.per) | 0, c = p.sel % d.per;
  if (dx){ const w = d.inRow(r); c = (c + dx + w) % w; }
  if (dy){ r = (r + dy + d.rows) % d.rows; c = Math.min(c, d.inRow(r) - 1); }
  const ns = r * d.per + c;
  if (ns !== p.sel){ p.sel = ns; SFX.move(); }
}

/* ── core play actions ── */
function startsWith(seq, pre){
  if (pre.length > seq.length) return false;
  for (let i = 0; i < pre.length; i++) if (seq[i] !== pre[i]) return false;
  return true;
}
function busyPlate(p){ return !!p.serve || p.scrapT > 0 || p.plateT < 0.6; }
function candidates(p, pre){
  return p.tickets.filter(t => (t.state === 'wait' || t.state === 'in') && !t.reserved && startsWith(t.seq, pre));
}
function addIng(p, id){
  if (G.scene !== 'play' || busyPlate(p)) return;
  if (p.serveTicket) return;   // build complete — it's already on its way
  const nb = p.build.concat(id);
  const cands = candidates(p, nb);
  if (!cands.length){ wrongIng(p, id); return; }
  p.build.push(id);
  const idx = p.build.length - 1;
  p.stack.push({ id, idx, off: 120 + Math.min(idx * 6, 40), vy: 0, landed: false, squash: 0 });
  const done = cands.find(t => t.seq.length === nb.length);
  if (done){ done.reserved = true; p.serveTicket = done; }
  p.pressT = 0.14; p.pressSel = p.unlocked.indexOf(id);
}
function wrongIng(p, id){
  SFX.bounce();
  if (window.ArcadeController) ArcadeController.rumble(p.idx, { duration: 120, strong: 0.3, weak: 0.5 });
  p.combo = 0; p.mistake = true;
  const L = layoutOf(p);
  const dir = Math.random() < 0.5 ? -1 : 1;
  if (p.bounces.length < 3)
    p.bounces.push({ id, idx: p.build.length, x: L.plateX, y: stackTopY(p) - 40, vx: dir * rnd(220, 330), vy: -rnd(300, 420), rot: 0, vr: dir * rnd(4, 9), t: 0 });
  // instructive, not descriptive (Maria's law): show WHICH tiles are right,
  // rate-limit the words.
  const valid = new Set();
  for (const t of candidates(p, p.build)) if (t.seq[p.build.length]) valid.add(t.seq[p.build.length]);
  p.pulseIds = [...valid].map(v => p.unlocked.indexOf(v)).filter(i => i >= 0);
  p.pulseT = 1.6;
  if (p.hintT <= 0){
    p.hintT = 6;
    const L2 = layoutOf(p);
    popup(p.build.length ? 'CHECK THE TICKET!' : 'MATCH AN ORDER!', L2.plateX, L2.plateY - 190, 19, PAL.cream, 1.4);
  }
  G.shakeT = 0.18;
}
function stackTopY(p){
  const L = layoutOf(p);
  let h = 0;
  for (const e of p.stack) h += layerSpr(e.id, e.idx, 'hero').rise * L.hero;
  return L.plateY - 10 - h;
}
function doScrap(p){
  if (G.scene !== 'play' || busyPlate(p) || !p.build.length) return;
  SFX.scrap();
  p.combo = 0; p.mistake = true;
  p.scrapT = 0.62;
  p.serveTicket = null;
  if (G.tips > 0){ G.tips -= 1; popup('-$1', layoutOf(p).plateX + 90, layoutOf(p).plateY - 120, 18, '#ffb0a0', 0.9); }
}
function startServe(p, t){
  const L = layoutOf(p);
  SFX.ding();
  if (window.ArcadeController) ArcadeController.rumble(p.idx, { duration: 180, strong: 0.5, weak: 0.7 });
  G.bellT = 0.5;
  const base = 2 + t.seq.length;
  const moodBonus = [3, 2, 1, 0][t.mood];
  if (p.mistake){ p.combo = 0; p.mistake = false; }
  p.combo++;
  p.bestCombo = Math.max(p.bestCombo, p.combo);
  const mult = 1 + 0.25 * Math.min(Math.max(p.combo - 1, 0), 8);
  const tip = Math.round((base + moodBonus) * mult);
  p.serve = { t: 0, seq: p.build.slice(), tip, dishName: t.name };
  p.build = []; p.stack = []; p.serveTicket = null;
  p.served++;
  t.state = 'served'; t.t = 0;
  sayBubble(t, pick(CHATTER.serve));
}
function finishServe(p){
  const L = layoutOf(p);
  const s = p.serve;
  G.tips += s.tip;
  SFX.tip(s.tip);
  popup('+$' + s.tip, L.passX, L.passY - 90, 26, PAL.goldLt, 1.2);
  if (p.combo >= 2) popup('COMBO x' + p.combo, L.plateX, L.plateY - 200, 20, '#8ff0e2', 1.1);
  burstServe(L.passX, L.passY - 10);
  p.serve = null;
  p.plateT = 0;
}
function joinP2(fromScene){
  if (P[1].active) return;
  P[1].active = true;
  P[1].unlocked = P[0].unlocked;
  P[1].sel = 0;
  SFX.join();
  if (fromScene === 'play'){
    G.banner = { text: 'P2 IN THE KITCHEN!', sub: 'shared tips — go go go!', t: 2.2 };
    G.spawnT = Math.min(G.spawnT, 0.6);
  }
}

/* ── day flow ── */
function startDay(day){
  G.day = day;
  G.tips = 0; G.expired = 0; G.orderNum = 0;
  G.closing = false; G.closeT = 0;
  G.dayLen = dayLen(day); G.timeLeft = G.dayLen;
  G.spawnT = 0.8;
  const unlocked = unlockedIngredients(day);
  for (const p of P){
    p.build = []; p.stack = []; p.tickets.forEach(t => { if (t.cv) TICKET_CV_POOL.push(t.cv); });
    p.tickets = [];
    p.serve = null; p.scrapT = 0; p.plateT = 1;
    p.bounces.length = 0; p.serveTicket = null;
    p.combo = 0; p.bestCombo = 0; p.served = 0; p.mistake = false;
    p.sel = 0; p.pulseT = 0; p.hintT = 0; p.flipT = 0;
    p.unlocked = unlocked;
  }
  P[0].active = true;
  if (G.p2Queued){ P[1].active = true; G.p2Queued = false; }
  G.panel1 = bakeGridPanel(unlocked, LAY1[0]);
  G.panel2 = bakeGridPanel(unlocked, LAY2[0]);
  const newDishes = DISHES.filter(d => d.day === day).map(d => d.name);
  G.intro = { t: 0, newFam: NEW_FAMILY[day] || null, newDishes, dur: 3.4 };
  G.scene = 'dayintro';
}
function endDay(){
  const served = P[0].served + (P[1].active ? P[1].served : 0);
  const total = served + G.expired;
  const ratio = total ? served / total : 1;
  const stars = (ratio >= 0.85 && served >= 4) ? 3 : (ratio >= 0.55 && served >= 2) ? 2 : 1;
  const bestCombo = Math.max(P[0].bestCombo, P[1].active ? P[1].bestCombo : 0);
  const prev = G.best[G.day] || { tips: 0, stars: 0 };
  const newBest = G.tips > prev.tips;
  G.best[G.day] = { tips: Math.max(prev.tips, G.tips), stars: Math.max(prev.stars, stars) };
  LS.set('best', G.best);
  G.wallet += G.tips;
  LS.set('wallet', G.wallet);
  G.maxDay = Math.max(G.maxDay, G.day + 1);
  LS.set('day', G.maxDay);
  G.report = { t: 0, stars, served, bestCombo, newBest, starSfx: 0, jingled: false };
  G.scene = 'report';
}

/* ═══════════════ SIM — fixed timestep, a frame is not game time ═══════ */
const DT = 1 / 60;

function stepPlayer(p, dt){
  const L = layoutOf(p);
  // held-direction repeat for the grid highlight
  const d = heldDir(p.idx);
  const qx = d.x > 0.5 ? 1 : d.x < -0.5 ? -1 : 0;
  const qy = d.y > 0.5 ? 1 : d.y < -0.5 ? -1 : 0;
  if (qx || qy){
    if (qx !== p.navX || qy !== p.navY){ moveSel(p, qx, qy); p.navT = 0.28; }
    else { p.navT -= dt; if (p.navT <= 0){ moveSel(p, qx, qy); p.navT = 0.12; } }
  }
  p.navX = qx; p.navY = qy;
  // stack physics: squashy drops
  let allLanded = true;
  for (const e of p.stack){
    if (!e.landed){
      e.vy += 1500 * dt;
      e.off -= e.vy * dt;
      if (e.off <= 0){
        e.off = 0; e.landed = true; e.squash = 1;
        SFX.plop(e.idx);
        p.plateDip = 1;
        burstLand(e.id, L.plateX, L.plateY - 10 - stackHeightBelow(p, e.idx) * L.hero);
      } else allLanded = false;
    } else if (e.squash > 0) e.squash = Math.max(0, e.squash - dt * 5);
  }
  if (p.plateDip > 0) p.plateDip = Math.max(0, p.plateDip - dt * 6);
  // completed build serves itself the moment the last layer lands
  if (p.serveTicket && allLanded && p.build.length === p.serveTicket.seq.length && !p.serve)
    startServe(p, p.serveTicket);
  // serve slide
  if (p.serve){
    p.serve.t += dt / 0.55;
    if (p.serve.t >= 1) finishServe(p);
  }
  if (p.plateT < 1) p.plateT = Math.min(1, p.plateT + dt / 0.3);
  // scrap gag
  if (p.scrapT > 0){
    const was = p.scrapT;
    p.scrapT -= dt;
    if (was > 0.31 && p.scrapT <= 0.31){
      p.build = []; p.stack = [];
      const n = LOWFX ? 3 : 6;
      for (let i = 0; i < n; i++) spawnPart(B.pSesame, L.plateX + rnd(-60, 60), L.plateY - 30, { vx: rnd(-80, 80), vy: rnd(-160, -60), grav: 500, life: 0.6, vr: 8 });
    }
    if (p.scrapT < 0) p.scrapT = 0;
  }
  // wrong-ingredient bounce sprites
  for (let i = p.bounces.length - 1; i >= 0; i--){
    const b = p.bounces[i];
    b.t += dt;
    b.vy += 1300 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
    if (b.t > 1 || b.y > 780) p.bounces.splice(i, 1);
  }
  if (p.pulseT > 0) p.pulseT -= dt;
  if (p.hintT > 0) p.hintT -= dt;
  if (p.pressT > 0) p.pressT -= dt;
  if (p.flipT > 0) p.flipT -= dt;
  // tickets
  for (let i = p.tickets.length - 1; i >= 0; i--){
    const t = p.tickets[i];
    const targetX = L.slotX(Math.min(t.slot, L.slots)) ;
    t.x += (targetX - t.x) * Math.min(1, dt * 7);
    if (t.state === 'in' && Math.abs(t.x - targetX) < 5) t.state = 'wait';
    if (t.bubbleT > 0){ t.bubbleT -= dt; if (t.bubbleT <= 0) t.bubble = null; }
    if (t.state === 'wait' && !t.reserved && !G.closing){
      t.patience -= dt;
      const r = t.patience / t.patMax;
      const mood = r > 0.62 ? 0 : r > 0.34 ? 1 : 2;
      if (mood !== t.mood){
        t.mood = mood;
        if (mood === 2 && !t.hurried){
          t.hurried = true;
          if (G.hurrySfxT <= 0){ SFX.hurry(); G.hurrySfxT = 4; sayBubble(t, pick(CHATTER.hurry)); }
        }
      }
      if (t.patience <= 0){
        t.state = 'leaving'; t.t = 0; t.mood = 3;
        sayBubble(t, pick(CHATTER.leave));
        if (G.walkSfxT <= 0){ SFX.walk(); G.walkSfxT = 2; }
        G.expired++;
        // a build aimed only at this ticket is now orphaned — that's fine,
        // scrapping is cheap and hinted, never a fail state
      }
    }
    if (t.state === 'served'){
      t.t += dt / 0.6;
      if (t.t >= 1) removeTicket(p, t);
    } else if (t.state === 'leaving'){
      t.t += dt / 0.9;
      if (t.t >= 1) removeTicket(p, t);
    }
  }
}
function stackHeightBelow(p, idx){
  let h = 0;
  for (let i = 0; i < idx; i++) h += layerSpr(p.stack[i].id, p.stack[i].idx, 'hero').rise;
  return h;
}

function stepPlay(dt){
  if (G.hurrySfxT > 0) G.hurrySfxT -= dt;
  if (G.walkSfxT > 0) G.walkSfxT -= dt;
  if (G.bellT > 0) G.bellT -= dt;
  if (G.shakeT > 0) G.shakeT -= dt;
  if (G.banner){ G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  for (const p of activePlayers()) stepPlayer(p, dt);
  updateParts(dt);
  for (const pp of POPS) if (pp.on){ pp.t += dt; pp.y += pp.vy * dt; if (pp.t > pp.life) pp.on = false; }
  if (!G.closing){
    G.timeLeft -= dt;
    // spawn pacing
    G.spawnT -= dt;
    const players = activePlayers();
    if (G.spawnT <= 0){
      const open = players.filter(p => p.tickets.filter(t => t.state !== 'served' && t.state !== 'leaving').length < layoutOf(p).slots);
      if (open.length){
        open.sort((a, b) => a.tickets.length - b.tickets.length);
        spawnTicket(open[0], pickDish());
        G.spawnT = spawnInterval();
      } else G.spawnT = 1.2;
    }
    // never leave a cook staring at an empty rail
    for (const p of players)
      if (!p.tickets.length && G.spawnT > 1 && G.timeLeft > 8) G.spawnT = 0.9;
    if (G.timeLeft <= 0){
      G.timeLeft = 0; G.closing = true; G.closeT = 0;
      G.banner = { text: 'CLOSING TIME!', sub: 'great work, chefs', t: 2.4 };
      for (const p of activePlayers())
        for (const t of p.tickets)
          if (!t.reserved && t.state !== 'served'){
            t.state = 'leaving'; t.t = 0; t.mood = 0;
            sayBubble(t, pick(CHATTER.closing));
          }
    }
  } else {
    G.closeT += dt;
    const busy = activePlayers().some(p => p.tickets.length || p.serve || p.stack.some(e => !e.landed));
    if ((!busy && G.closeT > 1.6) || G.closeT > 8) endDay();
  }
}

function routeEvent(ev){
  const { p: pi, b } = ev;
  if (G.scene === 'title'){
    if (b === 'left'){ G.pickDay = Math.max(1, G.pickDay - 1); SFX.move(); }
    else if (b === 'right'){ G.pickDay = Math.min(G.maxDay, G.pickDay + 1); SFX.move(); }
    else if (b === 'south' || b === 'start'){
      if (pi === 1 && !G.p2Queued){ G.p2Queued = true; SFX.join(); }
      else if (pi === 0) startDay(G.pickDay);
    }
  } else if (G.scene === 'dayintro'){
    if ((b === 'south' || b === 'start') && G.intro && G.intro.t > 0.7){ G.intro.t = G.intro.dur; }
  } else if (G.scene === 'play'){
    if (b === 'start'){
      if (pi === 1 && !P[1].active){ joinP2('play'); return; }
      G.scene = 'pause'; G.pauseSel = 0; SFX.pause(true); return;
    }
    if (pi === 1 && !P[1].active){
      if (b === 'south') joinP2('play');
      return;
    }
    const p = P[pi];
    if (!p.active) return;
    if (b === 'south'){ if (p.unlocked.length) addIng(p, p.unlocked[p.sel]); }
    else if (b === 'east') doScrap(p);
    else if (b === 'north'){
      if (p.flipT <= 0){
        p.flipT = 0.42; SFX.flip();
        const L = layoutOf(p);
        if (!LOWFX) for (let i = 0; i < 3; i++)
          spawnPart(B.pSpark, L.cookX + 40 + rnd(-10, 10), L.plateY - 120 - i * 14, { vy: -60, life: 0.5, s: 0.8, s1: 0.3, vr: 6 });
      }
    }
  } else if (G.scene === 'pause'){
    if (b === 'start'){ G.scene = 'play'; SFX.pause(false); }
    else if (b === 'up'){ G.pauseSel = (G.pauseSel + 2) % 3; SFX.move(); }
    else if (b === 'down'){ G.pauseSel = (G.pauseSel + 1) % 3; SFX.move(); }
    else if (b === 'south'){
      if (G.pauseSel === 0){ G.scene = 'play'; SFX.pause(false); }
      else if (G.pauseSel === 1){ startDay(G.day); }
      else toTitle();
    }
  } else if (G.scene === 'report'){
    if (pi === 1 && !P[1].active && b === 'south'){ G.p2Queued = true; SFX.join(); return; }
    if (G.report.t < 2.6){ if (b === 'south' || b === 'start') G.report.t = 2.6; return; }
    if (b === 'south' || b === 'start') startDay(Math.min(G.day + 1, G.maxDay));
    else if (b === 'west'){ G.scene = 'shop'; G.shopSel = 0; SFX.move(); }
    else if (b === 'east') toTitle();
  } else if (G.scene === 'shop'){
    if (b === 'east' || b === 'start'){ G.scene = 'report'; SFX.back(); }
    else if (b === 'left' || b === 'right'){
      const d2 = b === 'left' ? -1 : 1;
      const row = G.shopSel < 4 ? 0 : 1, len = row ? 4 : 4;
      const base = row * 4;
      G.shopSel = base + ((G.shopSel - base + d2 + len) % len);
      SFX.move();
    }
    else if (b === 'up' || b === 'down'){ G.shopSel = (G.shopSel + 4) % 8; SFX.move(); }
    else if (b === 'south') shopBuy(SHOP_ITEMS[G.shopSel]);
  }
}
function toTitle(){
  G.scene = 'title';
  G.pickDay = Math.min(G.maxDay, Math.max(G.day, 1));
  G.p2Queued = false;
  P[1].active = false;
  for (const p of P){
    p.tickets.forEach(t => { if (t.cv) TICKET_CV_POOL.push(t.cv); });
    p.tickets = []; p.build = []; p.stack = []; p.serve = null; p.serveTicket = null;
  }
  for (const pp of POPS) pp.on = false;
  for (const pt of PARTS) if (pt.on){ pt.on = false; }
  partCount = 0;
}
function shopBuy(item){
  const owned = G.cosm.owned.includes(item.id);
  if (!owned){
    if (G.wallet < item.price){ SFX.nope(); return; }
    G.wallet -= item.price;
    G.cosm.owned.push(item.id);
    SFX.buy();
  } else SFX.move();
  if (item.kind === 'neon') G.cosm.neon = item.val;
  else if (item.kind === 'counter'){ G.cosm.counter = item.val; bakeBGs(G.cosm); }
  else if (item.kind === 'jukebox'){
    G.cosm.jukebox = owned ? !G.cosm.jukebox : true;
    bakeBGs(G.cosm);
  }
  LS.set('cosm', G.cosm);
  LS.set('wallet', G.wallet);
}

function routeTap(x, y){
  if (G.scene === 'title'){
    // day picker arrows
    if (Math.abs(y - 596) < 30 && Math.abs(x - 640) < 160){
      if (x < 590){ G.pickDay = Math.max(1, G.pickDay - 1); SFX.move(); return; }
      if (x > 690){ G.pickDay = Math.min(G.maxDay, G.pickDay + 1); SFX.move(); return; }
    }
    startDay(G.pickDay);
  } else if (G.scene === 'dayintro'){
    if (G.intro && G.intro.t > 0.7) G.intro.t = G.intro.dur;
  } else if (G.scene === 'play'){
    // direct tap-an-ingredient — first-class gesture, coexists with the pad
    for (const p of activePlayers()){
      for (let i = 0; i < p.unlocked.length; i++){
        const r = tileRect(p, i);
        if (Math.abs(x - r.x) <= r.s / 2 + 4 && Math.abs(y - r.y) <= r.s / 2 + 4){
          p.sel = i;
          addIng(p, p.unlocked[i]);
          return;
        }
      }
    }
  } else if (G.scene === 'pause'){
    for (let i = 0; i < 3; i++)
      if (Math.abs(y - (330 + i * 62)) < 28){ G.pauseSel = i; routeEvent({ p: 0, b: 'south' }); return; }
    G.scene = 'play'; SFX.pause(false);
  } else if (G.scene === 'report'){
    if (G.report.t < 2.6){ G.report.t = 2.6; return; }
    if (y > 610 && x < 430){ G.scene = 'shop'; G.shopSel = 0; SFX.move(); }
    else if (y > 610 && x > 850) toTitle();
    else startDay(Math.min(G.day + 1, G.maxDay));
  } else if (G.scene === 'shop'){
    if (y > 640){ G.scene = 'report'; SFX.back(); return; }
    for (let i = 0; i < SHOP_ITEMS.length; i++){
      const r = shopItemRect(i);
      if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h){
        G.shopSel = i; shopBuy(SHOP_ITEMS[i]); return;
      }
    }
  }
}
function shopItemRect(i){
  const row = (i / 4) | 0, col = i % 4;
  return { x: 158 + col * 250, y: 200 + row * 200, w: 220, h: 170 };
}

function step(){
  G.tick++;
  const dt = DT;
  while (EV.length) routeEvent(EV.shift());
  while (TAPS.length){ const t = TAPS.shift(); routeTap(t.x, t.y); }
  G.sammyT += dt;
  if (G.scene === 'title'){
    G.titleT += dt;
    updateParts(dt);
  } else if (G.scene === 'dayintro'){
    G.intro.t += dt;
    if (G.intro.t >= G.intro.dur){
      G.scene = 'play';
      SFX.count(true);
    } else {
      const c0 = Math.ceil(Math.max(0.0001, G.intro.dur - 0.4 - G.intro.t) / 1);
      if (c0 !== G.intro.lastC && G.intro.t > G.intro.dur - 3.4 + 0.4){ G.intro.lastC = c0; SFX.count(false); }
    }
  } else if (G.scene === 'play'){
    stepPlay(dt);
  } else if (G.scene === 'report'){
    const r = G.report;
    const was = r.t;
    r.t += dt;
    // stamp sounds as lines land
    for (const st of [0.35, 0.55, 0.75, 0.95]) if (was < st && r.t >= st) SFX.stamp();
    for (let s = 0; s < r.stars; s++){
      const at = 1.45 + s * 0.38;
      if (was < at && r.t >= at){
        SFX.star(s);
        if (!LOWFX || s === r.stars - 1)
          for (let i = 0; i < 6; i++) spawnPart(B.pConf[i % 5], 640 + (s - 1) * 90, 430, { vx: rnd(-100, 100), vy: rnd(-200, -60), grav: 420, life: 0.9, vr: rnd(-9, 9) });
      }
    }
    if (r.stars === 3 && !r.jingled && r.t >= 2.6){ r.jingled = true; SFX.jingle(); }
    updateParts(dt);
    for (const pp of POPS) if (pp.on){ pp.t += dt; pp.y += pp.vy * dt; if (pp.t > pp.life) pp.on = false; }
  } else if (G.scene === 'shop' || G.scene === 'pause'){
    updateParts(dt);
  }

/* ═══════════════ RENDER — drawImage + transforms only in the hot path ═ */
function tileRect(p, i){
  const pan = twoP() ? G.panel2 : G.panel1;
  const r = pan.rects[i];
  const off = (twoP() && p.idx) ? 640 : 0;
  return { x: r.x + off, y: r.y, s: r.s };
}

function drawSeqStack(seq, x, baseY, s){
  let cum = 0;
  for (let i = 0; i < seq.length; i++){
    const ls = layerSpr(seq[i], i, 'hero');
    di(ls.spr, x, baseY - cum * s, s);
    cum += ls.rise;
  }
}
function drawLiveStack(p, L, x){
  let cum = 0;
  for (const e of p.stack){
    const ls = layerSpr(e.id, e.idx, 'hero');
    const yT = L.plateY - 10 - cum * L.hero;
    if (e.landed){
      if (e.squash > 0) diSquash(ls.spr, x, yT, L.hero, 1 - 0.32 * e.squash);
      else di(ls.spr, x, yT, L.hero);
    } else di(ls.spr, x, yT - e.off, L.hero);
    cum += ls.rise;
  }
}
function drawCook(p, L){
  const s = L.two ? 0.8 : 1;
  const bob = Math.sin(G.sammyT * 2.1 + p.idx * 2) * 2;
  const x = L.cookX, y = L.plateY + 4 + bob;
  di(B.cook[p.idx], x, y, s);
  // spatula arm — △ flips it for pure delight
  let rot = -0.55 + Math.sin(G.sammyT * 2.1 + p.idx * 2 + 1) * 0.05;
  if (p.flipT > 0){
    const pr = 1 - p.flipT / 0.42;
    rot = -0.55 - Math.sin(pr * Math.PI) * 2.3;
  }
  di(B.arm, x + 26 * s, y - 92 * s, s, rot);
}
let lastZ = -9;
function drawSammy(){
  const x = 962, y = 574;
  const breathe = 1 + Math.sin(G.sammyT * 1.8) * 0.012;
  diSquash(B.sammy, x, y, 1, breathe);
  // tail curls around the front, swaying in his sleep
  di(B.sammyTail, x - 42, y - 26, 1, Math.sin(G.sammyT * 1.4) * 0.22 + 0.35);
  if (!LOWFX && G.sammyT - lastZ > 2.8){
    lastZ = G.sammyT;
    spawnPart(B.pZee, x + 34, y - 62, { vy: -26, vx: 10, life: 2.1, s: 0.7, s1: 1.25, a: 0.9 });
  }
}
function drawParts(){
  for (const p of PARTS){
    if (!p.on) continue;
    const k = p.t / p.life;
    const s = lerp(p.s, p.s1, k);
    di(p.spr, p.x, p.y, s, p.rot, p.a * (k > 0.6 ? (1 - k) / 0.4 : 1));
  }
}
function drawPops(){
  for (const p of POPS){
    if (!p.on) continue;
    const k = p.t / p.life;
    const a = k > 0.65 ? (1 - k) / 0.35 : 1;
    ctx.globalAlpha = a;
    txt(p.text, p.x, p.y, p.px, p.color, 'center', true, 'rgba(59,38,32,0.85)');
    ctx.globalAlpha = 1;
  }
}
function drawTicket(p, t, L){
  const sc = L.ticketW / 150;
  const cx = t.x + L.ticketW / 2;
  let y = L.railY, rot = 0, a = 1;
  if (t.state === 'served'){ y -= easeIn(t.t) * 300; rot = t.t * 0.45; a = 1 - t.t; }
  else if (t.state === 'leaving'){ y += easeIn(t.t) * 150; rot = -t.t * 0.2; a = 1 - t.t * t.t; }
  else if (t.mood === 2) rot = Math.sin(G.sammyT * 16 + t.faceSeed) * 0.022;
  const card = { cv: t.cv, ax: 75, ay: 0 };
  di(card, cx, y, sc, rot, a);
  // face badge
  const face = B.faces[t.face][t.mood];
  di(face, cx + 62 * sc, y + 22 * sc, sc, rot, a);
  // live patience bar
  if (t.state === 'wait' || t.state === 'in'){
    const r = clamp(t.patience / t.patMax, 0, 1);
    ctx.fillStyle = t.mood === 0 ? '#5fae35' : t.mood === 1 ? PAL.gold : PAL.red;
    ctx.fillRect(t.x + 11 * sc, y + 168.5 * sc, (128 * r) * sc, 6 * sc);
  }
  if (t.bubble && t.bubbleT > 0)
    di(t.bubble, cx, y + 8, 1, 0, Math.min(1, t.bubbleT * 2));
}
function drawKitchen(p){
  const L = layoutOf(p);
  const shx = (p.idx === 0 && G.shakeT > 0) ? Math.sin(G.shakeT * 70) * 3 : 0;
  // grid panel + highlight
  const pan = twoP() ? G.panel2 : G.panel1;
  const poff = (twoP() && p.idx) ? 640 : 0;
  ctx.drawImage(pan.spr.cv, pan.x + poff, pan.y);
  if (p.pulseT > 0){
    const a = (0.5 + 0.5 * Math.sin(G.sammyT * 14)) * Math.min(1, p.pulseT);
    for (const i of p.pulseIds){
      const r = tileRect(p, i);
      di(B.pulse, r.x, r.y, r.s / 64, 0, a);
    }
  }
  if (p.pressT > 0 && p.pressSel >= 0 && p.pressSel < p.unlocked.length){
    const r = tileRect(p, p.pressSel);
    di(B.flash, r.x, r.y, r.s / 64, 0, p.pressT / 0.14);
  }
  {
    const r = tileRect(p, Math.min(p.sel, p.unlocked.length - 1));
    di(B.ring, r.x, r.y, (r.s / 64) * (1 + 0.045 * Math.sin(G.sammyT * 6)));
  }
  // cook
  drawCook(p, L);
  // plate + build
  if (p.serve){
    const k = easeIn(Math.min(1, p.serve.t));
    const x = lerp(L.plateX, L.passX, k) + shx;
    di(B.plate, x, L.plateY + 4, L.hero);
    drawSeqStack(p.serve.seq, x, L.plateY - 10, L.hero);
  } else if (p.plateT >= 1 || p.plateT > 0){
    const ps = L.hero * (0.55 + 0.45 * easeOut(p.plateT));
    diSquash(B.plate, L.plateX + shx, L.plateY + 4 + p.plateDip * 3, L.hero, ps / L.hero);
    drawLiveStack(p, L, L.plateX + shx);
  }
  // scrap lid gag
  if (p.scrapT > 0){
    const pr = 1 - p.scrapT / 0.62;
    let lx;
    if (pr < 0.4) lx = L.plateX + 320 * (1 - pr / 0.4);
    else if (pr < 0.72) lx = L.plateX + Math.sin(pr * 40) * 2;
    else lx = L.plateX + 340 * ((pr - 0.72) / 0.28);
    di(B.lid, lx, stackTopY(p) - 6, L.hero);
  }
  // wrong-ingredient bounces
  for (const b of p.bounces){
    const ls = layerSpr(b.id, b.idx, 'hero');
    di(ls.spr, b.x, b.y, L.hero * 0.9, b.rot, Math.max(0, 1 - b.t));
  }
  // service bell at the pass
  const bs = (L.two ? 0.7 : 1) * (G.bellT > 0 ? 1 + Math.sin(G.bellT * 40) * 0.1 * G.bellT : 1);
  if (G.bellT > 0.3) di(B.pGlow, L.passX + (L.two ? 44 : 76), L.passY - 20, 2.2, 0, (G.bellT - 0.3) * 2);
  di(B.bell, L.passX + (L.two ? 44 : 76), L.passY + 2, bs);
  // tickets last (they hang over everything)
  for (const t of p.tickets) drawTicket(p, t, L);
}

  }
  { // report / intro paper card
    const c = mk(560, 420), g = c.getContext('2d');
    rr(g, 6, 6, 548, 408, 10);
    g.fillStyle = 'rgba(40,20,10,0.35)'; g.fill();
    rr(g, 2, 2, 548, 408, 10);
    g.fillStyle = vgrad(g, 0, 420, [[0, '#fffbf0'], [0.8, PAL.paper], [1, '#eadbb8']]); g.fill();
    g.strokeStyle = PAL.redDk; g.lineWidth = 5; rr(g, 10, 10, 532, 392, 6); g.stroke();
    g.strokeStyle = 'rgba(176,53,40,0.4)'; g.lineWidth = 2; rr(g, 18, 18, 516, 376, 4); g.stroke();
    B.paper = anchorSpr(c, 277, 212);
  }
  { // shop card
    const c = mk(220, 170), g = c.getContext('2d');
    rr(g, 3, 3, 214, 164, 12);
    g.fillStyle = vgrad(g, 0, 170, [[0, '#fffaf0'], [1, '#e8d6ae']]); g.fill();
    g.strokeStyle = 'rgba(120,90,50,0.5)'; g.lineWidth = 2.5; g.stroke();
    B.shopCard = anchorSpr(c, 110, 85);
  }
  B.counterSwatch = {};
  for (const key in COUNTERS){
    const c = mk(120, 64), g = c.getContext('2d');
    const ck = COUNTERS[key];
    rr(g, 4, 8, 112, 40, 8);
    g.fillStyle = vgrad(g, 8, 48, [[0, ck.top2], [0.4, ck.top], [1, ck.front]]); g.fill();
    g.strokeStyle = PAL.chrome; g.lineWidth = 4; g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.3)'; rr(g, 10, 12, 100, 8, 4); g.fill();
    B.counterSwatch[key] = anchorSpr(c, 60, 32);
  }
  { // jukebox icon
    const c = mk(110, 165), g = c.getContext('2d');
    paintJukebox(g, 6, 6);
    B.jukeIcon = anchorSpr(c, 55, 82);
  }
  B.cook = [bakeCook('#e04f3f', '#b03528'), bakeCook('#3fbfae', '#2d8f84')];
  B.arm = bakeArm();
  B.sammy = bakeSammy();
  B.sammyTail = bakeSammyTail();
}

function boot(){
  bakeIngredients();
  bakeFaces();
  bakeMisc();
  bakeRegister();
  bakeClock();
  bakeExtras();
  bakeBGs(G.cosm);
  neonSign(G.cosm.neon);
  neonLogo(G.cosm.neon);
  G.pickDay = G.maxDay;
  G.panel1 = bakeGridPanel(unlockedIngredients(1), LAY1[0]);
  G.panel2 = bakeGridPanel(unlockedIngredients(1), LAY2[0]);
}

/* fixed-timestep main loop — a frame is not game time */
let last = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  acc += Math.min(now - last, 250);
  last = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 5){ step(); acc -= 1000 / 60; n++; }
  if (n === 5) acc = 0;
  render();
}
boot();
requestAnimationFrame(frame);

// read-only observability for the verification harness (real inputs only)
window.__game = G;
window.__players = P;
</script>
